name: Connector verification and release

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified package to nuget.org and create a preview GitHub release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: connector-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve and verify release version
        id: version
        shell: pwsh
        run: |
          $version = [string](Get-Content csweet-plugin.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match the manifest.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Test, self-test, pack, inspect and consume package
        shell: pwsh
        run: ./scripts/Test-Release.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: connector-tests
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: connector-release
          path: artifacts/release/${{ steps.version.outputs.version }}/
          if-no-files-found: error

  publish:
    needs: verify
    if: github.repository == 'CrosswiredStudios/CSweet.Plugins.Platform.YouTube' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish))
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: connector-release
          path: release
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify staged digests
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish consumer package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if ([string]::IsNullOrWhiteSpace($env:NUGET_API_KEY)) { throw 'Configure the release environment NUGET_API_KEY first.' }
          dotnet nuget push release/*.nupkg --source https://api.nuget.org/v3/index.json --api-key $env:NUGET_API_KEY
      - name: Create traceable preview release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $files = @(Get-ChildItem release -File | ForEach-Object FullName)
          gh release create "v$env:RELEASE_VERSION" --target $env:RELEASE_COMMIT --title "YouTube connector $env:RELEASE_VERSION preview" --prerelease --notes-file "release/$env:RELEASE_VERSION.md" @files
